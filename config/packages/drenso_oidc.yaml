drenso_oidc:
    clients:
        default:
            well_known_url: '%env(IDENTITY_LINK_DISCOVERY_URL)%'
            client_id: '%env(IDENTITY_LINK_CLIENT_ID)%'
            client_secret: '%env(IDENTITY_LINK_CLIENT_SECRET)%'
            # Must match the redirect URI registered in Identity Link.
            redirect_route: connect_identity_link_check
            # PKCE is off unless this is set.
            code_challenge_method: S256
